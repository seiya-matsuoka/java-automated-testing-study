services:
  postgres:
    # 学習開始前の通常動作確認で使用する PostgreSQL。
    # Unit 06 以降の自動テストでは、別途 Testcontainers の PostgreSQL を使用する。
    image: postgres:18.6
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d order_management"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  shipping-fee-stub:
    # Production Code の手動動作確認専用の Shipping Fee API Stub。
    # Unit 08 では、テストコードから制御する WireMock を別途学習・利用する。
    image: wiremock/wiremock:3.13.2

    # 通常動作確認では plain HTTP の HTTP/2 を無効化し、
    # Shipping Fee API Stub との通信を HTTP/1.1 で安定させる。
    command:
      - --disable-http2-plain

    ports:
      - "8081:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro

volumes:
  # 通常動作確認用 PostgreSQL のデータを Container 再作成後も保持する。
  postgres-data:
